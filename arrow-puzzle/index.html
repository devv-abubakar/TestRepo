<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arrow Escape</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --tile: #e8e3d8; --accent: #2f6fed; --bad: #e0464e; --good: #1f9d6b;
    --up: #2f6fed; --right: #e8833a; --down: #8a4fd6; --left: #1f9d6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --panel: #1d2029; --ink: #eceef3; --muted: #9aa1ae;
      --tile: #262a35; --accent: #6b9bff; --bad: #ff6b72; --good: #43c792;
      --up: #6b9bff; --right: #ffa25e; --down: #b388ff; --left: #43c792;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  header { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .stats { display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; }
  .hearts { color: var(--bad); font-size: 18px; letter-spacing: 2px; }
  .hint-text { color: var(--muted); font-size: 13px; margin: 8px 0 12px; text-align: center; max-width: 560px; }
  #wrap { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; background: var(--panel); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
    background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  button.primary { background: var(--accent); color: #fff; }
  button:active { transform: translateY(1px); }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border-radius: 16px; background: color-mix(in srgb, var(--panel) 88%, transparent); text-align: center; padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 28px; }
  #overlay p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Arrow Escape</h1>
  <div class="stats">
    <span>Level <b id="level">1</b></span>
    <span>Left <b id="left">0</b></span>
    <span class="hearts" id="hearts">♥♥♥</span>
  </div>
</header>
<p class="hint-text">Tap an arrow to slide it off the board. It only escapes if nothing is in its way — a blocked arrow costs a heart. Clear every arrow to win.</p>
<div id="wrap">
  <canvas id="board"></canvas>
  <div id="overlay"><h2 id="ovTitle"></h2><p id="ovText"></p><button class="primary" id="ovBtn"></button></div>
</div>
<div class="controls">
  <button id="hintBtn">💡 Hint</button>
  <button id="undoBtn">↶ Undo</button>
  <button id="restartBtn">⟲ Restart</button>
</div>

<script>
(() => {
  // ---------- constants ----------
  const DIRS = [ [0,-1], [1,0], [0,1], [-1,0] ];            // up, right, down, left
  const DIR_VARS = ['--up', '--right', '--down', '--left'];
  const MAX_HEARTS = 3;

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ---------- puzzle logic ----------
  // grid[y][x] = direction (0..3) or -1 for empty
  function blocker(grid, x, y) {
    const n = grid.length, [dx, dy] = DIRS[grid[y][x]];
    let cx = x + dx, cy = y + dy;
    while (cx >= 0 && cy >= 0 && cx < n && cy < n) {
      if (grid[cy][cx] !== -1) return [cx, cy];
      cx += dx; cy += dy;
    }
    return null;
  }
  // Removing arrows only ever frees paths, so greedy removal decides solvability.
  function stuckCells(grid) {
    const g = grid.map(r => r.slice()), n = g.length;
    let progress = true;
    while (progress) {
      progress = false;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
        if (g[y][x] !== -1 && !blocker(g, x, y)) { g[y][x] = -1; progress = true; }
    }
    const stuck = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (g[y][x] !== -1) stuck.push([x, y]);
    return stuck;
  }
  function generate(level) {
    const rand = mulberry32(level * 9973 + 17);
    const n = Math.min(4 + Math.floor((level - 1) / 2), 10);
    const density = Math.min(0.55 + level * 0.03, 0.92);
    const grid = Array.from({ length: n }, () => Array.from({ length: n }, () =>
      rand() < density ? Math.floor(rand() * 4) : -1));
    // Re-roll the directions of arrows trapped in blocking cycles until the board is solvable.
    for (let tries = 0; tries < 500; tries++) {
      const stuck = stuckCells(grid);
      if (!stuck.length) return grid;
      for (const [x, y] of stuck) if (rand() < 0.5) grid[y][x] = Math.floor(rand() * 4);
    }
    // Fallback (practically unreachable): point every trapped arrow toward its nearest edge.
    for (const [x, y] of stuckCells(grid)) grid[y][x] = y < n / 2 ? 0 : 2;
    return stuckCells(grid).length ? generate(level + 1000) : grid;
  }

  // ---------- state ----------
  let level = 1;
  try { level = Math.max(1, parseInt(localStorage.getItem('arrowEscapeLevel'), 10) || 1); } catch {}
  let grid, hearts, history, anims, hintCell, busy, over;

  const $ = id => document.getElementById(id);
  const canvas = $('board'), ctx = canvas.getContext('2d');

  function startLevel() {
    grid = generate(level);
    hearts = MAX_HEARTS; history = []; anims = []; hintCell = null; busy = false; over = false;
    $('overlay').classList.remove('show');
    try { localStorage.setItem('arrowEscapeLevel', level); } catch {}
    updateHud(); draw();
  }
  function remaining() { return grid.flat().filter(v => v !== -1).length; }
  function updateHud() {
    $('level').textContent = level;
    $('left').textContent = remaining();
    $('hearts').textContent = '♥'.repeat(hearts) + '♡'.repeat(MAX_HEARTS - hearts);
  }
  function showOverlay(title, text, btn, fn) {
    $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovBtn').textContent = btn;
    $('ovBtn').onclick = fn; $('overlay').classList.add('show');
  }

  // ---------- input ----------
  function tap(x, y) {
    if (over || grid[y]?.[x] === undefined || grid[y][x] === -1) return;
    hintCell = null;
    const dir = grid[y][x], block = blocker(grid, x, y);
    if (block) {
      const dist = Math.abs(block[0] - x) + Math.abs(block[1] - y) - 1;
      anims.push({ type: 'bump', x, y, dir, dist, t0: performance.now(), dur: 260 + dist * 40 });
      anims.push({ type: 'shake', x: block[0], y: block[1], t0: performance.now() + (dist * 40 + 130), dur: 300 });
      hearts--; updateHud(); vibrate(60);
      if (hearts <= 0) { over = true; setTimeout(() => showOverlay('Out of hearts', 'Those arrows were in the way.', 'Try again', startLevel), 500); }
    } else {
      history.push({ x, y, dir });
      grid[y][x] = -1;
      anims.push({ type: 'fly', x, y, dir, t0: performance.now(), dur: 380 });
      updateHud();
      if (!remaining()) { over = true; setTimeout(() => showOverlay('Level ' + level + ' cleared!', hearts === MAX_HEARTS ? 'Flawless — no hearts lost.' : 'Nicely done.', 'Next level →', () => { level++; startLevel(); }), 450); }
    }
    loop();
  }
  function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }

  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect(), n = grid.length;
    const { pad, cell } = layout(r.width);
    const x = Math.floor((e.clientX - r.left - pad) / cell), y = Math.floor((e.clientY - r.top - pad) / cell);
    if (x >= 0 && y >= 0 && x < n && y < n) tap(x, y);
  });
  $('restartBtn').onclick = startLevel;
  $('undoBtn').onclick = () => {
    if (over || !history.length) return;
    const m = history.pop(); grid[m.y][m.x] = m.dir; updateHud(); draw();
  };
  $('hintBtn').onclick = () => {
    if (over) return;
    const n = grid.length;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (grid[y][x] !== -1 && !blocker(grid, x, y)) { hintCell = { x, y, t0: performance.now() }; loop(); return; }
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'r') startLevel();
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) $('undoBtn').click();
  });

  // ---------- rendering ----------
  function layout(w) { const pad = w * 0.04; return { pad, cell: (w - pad * 2) / grid.length }; }
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const ease = t => 1 - Math.pow(1 - t, 3);

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawArrow(cx, cy, size, dir, color, alpha = 1, scale = 1) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(dir * Math.PI / 2); ctx.scale(scale, scale);
    const s = size * 0.42;
    roundRect(-s, -s, s * 2, s * 2, s * 0.35); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(0, -s * 0.72); ctx.lineTo(s * 0.6, -s * 0.05); ctx.lineTo(s * 0.22, -s * 0.05);
    ctx.lineTo(s * 0.22, s * 0.68); ctx.lineTo(-s * 0.22, s * 0.68); ctx.lineTo(-s * 0.22, -s * 0.05);
    ctx.lineTo(-s * 0.6, -s * 0.05); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw(now = performance.now()) {
    if (!grid) return;
    const w = canvas.getBoundingClientRect().width, n = grid.length, { pad, cell } = layout(w);
    ctx.clearRect(0, 0, w, w);
    const tile = css('--tile'), colors = DIR_VARS.map(css);
    const center = (x, y) => [pad + (x + 0.5) * cell, pad + (y + 0.5) * cell];

    // board tiles
    ctx.fillStyle = tile;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      roundRect(pad + x * cell + cell * 0.06, pad + y * cell + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.16); ctx.fill();
    }

    // hint: pulsing highlight + path preview
    if (hintCell && grid[hintCell.y][hintCell.x] !== -1) {
      const p = (Math.sin((now - hintCell.t0) / 180) + 1) / 2, [dx, dy] = DIRS[grid[hintCell.y][hintCell.x]];
      ctx.fillStyle = css('--accent'); ctx.globalAlpha = 0.15 + p * 0.15;
      let cx = hintCell.x, cy = hintCell.y;
      while (cx >= 0 && cy >= 0 && cx < n && cy < n) {
        roundRect(pad + cx * cell + cell * 0.06, pad + cy * cell + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.16); ctx.fill();
        cx += dx; cy += dy;
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = css('--accent'); ctx.lineWidth = Math.max(3, cell * 0.06);
      const g = cell * (0.02 + p * 0.03);
      roundRect(pad + hintCell.x * cell + g, pad + hintCell.y * cell + g, cell - g * 2, cell - g * 2, cell * 0.2); ctx.stroke();
    }

    const animated = new Set(anims.filter(a => a.type !== 'fly').map(a => a.y * n + a.x));
    // static arrows
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const d = grid[y][x];
      if (d !== -1 && !animated.has(y * n + x)) drawArrow(...center(x, y), cell, d, colors[d]);
    }
    // animations
    anims = anims.filter(a => now < a.t0 + a.dur || now < a.t0);
    for (const a of anims) {
      const t = Math.max(0, Math.min(1, (now - a.t0) / a.dur)), [cx, cy] = center(a.x, a.y), [dx, dy] = DIRS[a.dir ?? 0];
      if (a.type === 'fly') {
        const dist = ease(t) * w * 1.1;
        drawArrow(cx + dx * dist, cy + dy * dist, cell, a.dir, colors[a.dir], 1 - t * 0.6);
      } else if (a.type === 'bump') {
        const reach = (a.dist + 0.18) * cell, k = t < 0.5 ? ease(t * 2) : 1 - ease((t - 0.5) * 2);
        drawArrow(cx + dx * reach * k, cy + dy * reach * k, cell, a.dir, t < 0.6 && t > 0.4 ? css('--bad') : colors[a.dir]);
      } else if (a.type === 'shake') {
        const d = grid[a.y][a.x], off = now < a.t0 ? 0 : Math.sin(t * Math.PI * 6) * cell * 0.08 * (1 - t);
        if (d !== -1) drawArrow(cx + off, cy, cell, d, colors[d]);
      }
    }
  }

  let raf = 0;
  function loop() {
    if (raf) return;
    const step = now => {
      draw(now);
      raf = (anims.length || hintCell) ? requestAnimationFrame(step) : 0;
    };
    raf = requestAnimationFrame(step);
  }

  new ResizeObserver(resize).observe(canvas);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => draw());
  startLevel();
})();
</script>
</body>
</html>
